[project]
name = "mnemo"
version = "0.1.0"
description = "Personal AI bookmark app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
