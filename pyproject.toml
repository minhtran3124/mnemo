[project]
name = "mnemo"
version = "0.1.0"
description = "Personal AI bookmark app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0,<3",
    "pydantic-settings>=2.16.2,<3",
    "httpx2>=2.16.0,<3",
    "trafilatura>=2.3.1,<3",
    "fastapi>=0.162.0,<1",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
