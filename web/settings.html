<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Mnemo</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
<!--HEADER-->
<main>
  <h1>Settings</h1>
  <form>
    <fieldset class="panel">
      <legend><h2>Appearance</h2></legend>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="system"><span class="choice-text"><strong>System (default)</strong><span>Matches your phone. Changes when your phone changes.</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></label>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="light"><span class="choice-text"><strong>Light</strong><span>Paper background, dark ink.</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></label>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="dark"><span class="choice-text"><strong>Dark</strong><span>Dark background, light ink.</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></label>
      <p class="note">Mnemo remembers your choice on this device.</p>
    </fieldset>
  </form>
</main>
</body>
</html>
