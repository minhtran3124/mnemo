<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Mnemo</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
<!--HEADER-->
<main>
  <h1>Settings</h1>
  <form>
    <fieldset class="panel">
      <legend>Appearance</legend>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="system"> System</label>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="light"> Light</label>
      <label class="choice"><input type="radio" name="theme" data-theme-choice="dark"> Dark</label>
      <p class="note">System follows your device. Mnemo remembers your choice on this device.</p>
    </fieldset>
  </form>
</main>
</body>
</html>
