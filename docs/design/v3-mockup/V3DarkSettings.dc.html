<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mnemo settings v3 dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#F4F6F8;color:#101828}
a,button,label{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.th{--bg:#F4F6F8;--surface:#FFFFFF;--ink:#101828;--ink2:#1D2939;--muted:#4B5565;--line-strong:#101828;--rule:#D0D5DD;--ctl-line:#667085;--accent:#C2371A;--accent-hover:#8F2810;--on-accent:#FFFFFF;--warn-bg:#FFF4D6;--warn:#7A4B00;--warn-text:#5C3800}
@media (prefers-color-scheme: dark){.th:has(.thr-sys:checked){--bg:#12151B;--surface:#1B2029;--ink:#E8ECF2;--ink2:#CBD2DD;--muted:#A3ADBD;--line-strong:#9AA4B5;--rule:#2D3541;--ctl-line:#7F8A9C;--accent:#FF8A6B;--accent-hover:#FFB39E;--on-accent:#12151B;--warn-bg:#2A2210;--warn:#E9C46A;--warn-text:#F3DC9C}}
.th:has(.thr-dark:checked){--bg:#12151B;--surface:#1B2029;--ink:#E8ECF2;--ink2:#CBD2DD;--muted:#A3ADBD;--line-strong:#9AA4B5;--rule:#2D3541;--ctl-line:#7F8A9C;--accent:#FF8A6B;--accent-hover:#FFB39E;--on-accent:#12151B;--warn-bg:#2A2210;--warn:#E9C46A;--warn-text:#F3DC9C}
.th:has(.thr-light:checked){--bg:#F4F6F8;--surface:#FFFFFF;--ink:#101828;--ink2:#1D2939;--muted:#4B5565;--line-strong:#101828;--rule:#D0D5DD;--ctl-line:#667085;--accent:#C2371A;--accent-hover:#8F2810;--on-accent:#FFFFFF;--warn-bg:#FFF4D6;--warn:#7A4B00;--warn-text:#5C3800}
.th .thr{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.th .thl{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;color:var(--ink);cursor:pointer}
.th .thr:checked+.thl{background:var(--ink);color:var(--bg)}
.th .thr:focus-visible+.thl{outline:3px solid var(--accent);outline-offset:-3px}
.th .row{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer;box-sizing:border-box}
.th .mark{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);box-sizing:border-box;display:block}
.th .thr:checked+.row .mark,.th .vr:checked+.row .mark{background:var(--ink);box-shadow:inset 0 0 0 4px var(--bg)}
.th .thr:focus-visible+.row,.th .vr:focus-visible+.row{outline:3px solid var(--accent);outline-offset:2px}

</style>
</helmet>
<div class="th" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;overflow:hidden">
<header style="padding:14px 16px 0 16px"><div style="font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:24px;letter-spacing:-0.01em">Mnemo</div><div style="margin-top:10px;border-top:3px double var(--line-strong)"></div></header>
<main style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding:16px">
<h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-0.02em">Settings</h1>
<section aria-label="Appearance" style="display:flex;flex-direction:column">
<h2 style="margin:0 0 6px 0;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px">Appearance</h2>
<div role="radiogroup" aria-label="Theme">
<input class="thr thr-sys" type="radio" name="th-SD" id="SD-sys"><label class="row" for="SD-sys"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">System (default)</span><span style="display:block;font-size:14px;color:var(--muted)">Matches your phone. Changes when your phone changes.</span></span><span style="color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span></label>
<input class="thr thr-light" type="radio" name="th-SD" id="SD-light"><label class="row" for="SD-light"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">Light</span><span style="display:block;font-size:14px;color:var(--muted)">Paper background, dark ink.</span></span><span style="color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></label>
<input class="thr thr-dark" type="radio" name="th-SD" id="SD-dark" checked><label class="row" for="SD-dark"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">Dark</span><span style="display:block;font-size:14px;color:var(--muted)">Dark background, light ink.</span></span><span style="color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></label>
</div>
<div style="border-top:1px solid var(--line-strong);padding-top:12px;margin-top:6px"><div style="font-size:13px;color:var(--muted);margin-bottom:6px">Preview</div>
<div style="display:flex;gap:16px"><span style="flex:0 0 88px;font-size:13px;color:var(--muted)">AI and agents</span><div><div style="font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:19px;line-height:1.25">Jev is now available in LangSmith evals</div><div style="font-size:13px;color:var(--muted)">Article on langchain.com</div></div></div></div>
</section>
<section aria-label="Bookmark view" style="display:flex;flex-direction:column">
<h2 style="margin:0 0 6px 0;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px">Bookmark view</h2>
<div role="radiogroup" aria-label="Bookmark view">
<input class="vr" type="radio" name="sv-D" id="VD-ledger" style="position:absolute;width:1px;height:1px;opacity:0" checked><label class="row" for="VD-ledger"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">Ledger</span><span style="display:block;font-size:14px;color:var(--muted)">One entry per line. The folder is in the margin.</span></span></label>
<input class="vr" type="radio" name="sv-D" id="VD-cards" style="position:absolute;width:1px;height:1px;opacity:0"><label class="row" for="VD-cards"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">Cards</span><span style="display:block;font-size:14px;color:var(--muted)">Boxed tiles, two columns on a laptop.</span></span></label>
<input class="vr" type="radio" name="sv-D" id="VD-compact" style="position:absolute;width:1px;height:1px;opacity:0"><label class="row" for="VD-compact"><span class="mark"></span><span style="flex:1"><span style="display:block;font-weight:700">Compact</span><span style="display:block;font-size:14px;color:var(--muted)">Dense text rows.</span></span></label>
</div>
<div style="border-top:1px solid var(--rule)"></div>
<p style="margin:10px 0 0 0;font-size:14px;color:var(--muted)">Mnemo remembers your choice on this device.</p>
</section>
</main>
<nav style="display:flex;border-top:1px solid var(--line-strong);padding:0 16px 16px 16px" aria-label="Main">

<div style="flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px">Settings</div>
</nav>
</div>
